openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: dashboard
    description: Role-aware dashboard summaries
  - name: enrollment
    description: Applicant verification queue operations
  - name: students
    description: Student masterlist operations
  - name: academics
    description: Authenticated student academic records
  - name: resources
    description: Academic policies and frequently asked questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to the enrollment portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: No active session
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard metrics for the active role
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /enrollment/queue:
    get:
      operationId: listEnrollmentQueue
      tags: [enrollment]
      summary: List applicants awaiting review
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, verified, enrolled]
            default: all
      responses:
        "200":
          description: Enrollment queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentApplicant"
  /enrollment/queue/{id}/review:
    post:
      operationId: reviewEnrollment
      tags: [enrollment]
      summary: Verify or return an applicant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewEnrollmentInput"
      responses:
        "200":
          description: Updated applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentApplicant"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List enrolled students
      responses:
        "200":
          description: Student masterlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
  /students/me/enrollment:
    get:
      operationId: getStudentEnrollment
      tags: [academics]
      summary: Get the authenticated student's enrollment record
      responses:
        "200":
          description: Enrollment record and progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentEnrollment"
        "401":
          description: No active session
        "403":
          description: The active user is not a student
        "404":
          description: Student record not found
  /students/me/grades:
    get:
      operationId: listStudentGrades
      tags: [academics]
      summary: List grades for the authenticated student
      parameters:
        - name: academicYear
          in: query
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Student grades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeRecord"
        "401":
          description: No active session
        "403":
          description: The active user is not a student
  /students/me/plan-of-study:
    get:
      operationId: listStudentPlanOfStudy
      tags: [academics]
      summary: List the authenticated student's plan of study
      parameters:
        - name: yearLevel
          in: query
          schema: { type: string }
        - name: semester
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Student plan of study subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanSubject"
        "401":
          description: No active session
        "403":
          description: The active user is not a student
  /academic-policies:
    get:
      operationId: listAcademicPolicies
      tags: [resources]
      summary: List published academic policy documents and pages
      responses:
        "200":
          description: Academic policy documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyDocument"
  /faq:
    get:
      operationId: listFaqEntries
      tags: [resources]
      summary: List active frequently asked questions
      responses:
        "200":
          description: Frequently asked questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqEntry"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [admin, admission, registrar, teacher, student]
      required: [email, password, role]
    SessionUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        role:
          type: string
          enum: [admin, admission, registrar, teacher, student]
        status: { type: string }
      required: [id, email, fullName, role, status]
    DashboardSummary:
      type: object
      properties:
        activeAcademicYear: { type: string }
        totalApplicants: { type: integer }
        pendingReview: { type: integer }
        enrolledStudents: { type: integer }
        activeClasses: { type: integer }
        completionRate: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
      required:
        [activeAcademicYear, totalApplicants, pendingReview, enrolledStudents, activeClasses, completionRate, recentActivity]
    ActivityItem:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        detail: { type: string }
        timestamp: { type: string }
        tone:
          type: string
          enum: [blue, green, amber, slate]
      required: [id, label, detail, timestamp, tone]
    EnrollmentApplicant:
      type: object
      properties:
        id: { type: integer }
        studentNumber: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        program: { type: string }
        submittedAt: { type: string }
        documentCount: { type: integer }
        status:
          type: string
          enum: [pending, verified, enrolled]
        remarks:
          type: ["string", "null"]
      required: [id, studentNumber, fullName, email, program, submittedAt, documentCount, status, remarks]
    ReviewEnrollmentInput:
      type: object
      properties:
        decision:
          type: string
          enum: [verified, pending]
        remarks:
          type: string
          maxLength: 500
      required: [decision]
    Student:
      type: object
      properties:
        id: { type: integer }
        studentNumber: { type: string }
        fullName: { type: string }
        program: { type: string }
        yearLevel: { type: string }
        load: { type: string }
        status:
          type: string
          enum: [active, probation, pending]
      required: [id, studentNumber, fullName, program, yearLevel, load, status]
    StudentEnrollment:
      type: object
      properties:
        id: { type: integer }
        studentNumber: { type: string }
        fullName: { type: string }
        program: { type: string }
        yearLevel: { type: string }
        academicYear: { type: string }
        enrollmentStatus:
          type: string
          enum: [pending, verified, enrolled]
        courses:
          type: array
          items:
            $ref: "#/components/schemas/StudentCourse"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentStep"
      required: [id, studentNumber, fullName, program, yearLevel, academicYear, enrollmentStatus, courses, steps]
    EnrollmentStep:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [not_started, in_progress, completed]
        displayOrder: { type: integer }
      required: [key, label, status, displayOrder]
    StudentCourse:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        units: { type: integer }
        semester: { type: string }
        academicYear: { type: string }
        status: { type: string }
      required: [code, title, units, semester, academicYear, status]
    GradeRecord:
      type: object
      properties:
        id: { type: integer }
        academicYear: { type: string }
        semester: { type: string }
        yearLevel: { type: string }
        section: { type: ["string", "null"] }
        code: { type: string }
        title: { type: string }
        units: { type: integer }
        finalGrade: { type: string }
        remark: { type: string }
      required: [id, academicYear, semester, yearLevel, section, code, title, units, finalGrade, remark]
    PlanSubject:
      type: object
      properties:
        id: { type: integer }
        yearLevel: { type: string }
        semester: { type: string }
        code: { type: string }
        description: { type: string }
        units: { type: integer }
        prerequisite: { type: string }
        curriculumYear: { type: string }
        status: { type: string }
        displayOrder: { type: integer }
      required: [id, yearLevel, semester, code, description, units, prerequisite, curriculumYear, status, displayOrder]
    PolicyPage:
      type: object
      properties:
        pageNumber: { type: integer }
        heading: { type: string }
        body: { type: string }
      required: [pageNumber, heading, body]
    PolicyDocument:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        fileName: { type: string }
        academicYear: { type: string }
        pageCount: { type: integer }
        summary: { type: string }
        updatedAt: { type: string, format: date-time }
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PolicyPage"
      required: [id, title, fileName, academicYear, pageCount, summary, updatedAt, pages]
    FaqEntry:
      type: object
      properties:
        id: { type: integer }
        question: { type: string }
        answer: { type: string }
        displayOrder: { type: integer }
        updatedAt: { type: string, format: date-time }
      required: [id, question, answer, displayOrder, updatedAt]

